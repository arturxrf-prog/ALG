<style>
:root{--bg:#0b0b0d;--card:#141417;--card2:#1c1b1f;--ink:#f3ecd9;--mute:#a59f8c;--line:#2d2b26;--gold:#d4a84b;--gold2:#f0cf7e;--glow:rgba(212,168,75,.16);--glow2:rgba(212,168,75,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 60px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:clamp(2.1rem,7vw,3.2rem);line-height:1.08;font-weight:800;letter-spacing:-.02em;color:var(--gold2);background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:1.8rem;color:var(--gold2)}
nav{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 20px;padding:4px 18px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.88rem;font-weight:500;white-space:nowrap}
nav a.on{background:var(--gold);color:#17120a;border-color:var(--gold);font-weight:600}
.sub{color:var(--mute);margin:8px 0 20px;max-width:60ch}
.verse{border-left:3px solid var(--gold);background:var(--card);padding:16px 18px;border-radius:0 14px 14px 0}
.verse p{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.15rem}
.verse span{display:block;margin-top:6px;color:var(--gold);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.8rem;color:var(--gold2)}
.stat small{color:var(--mute)}
.tiles,.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:22px}
.grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:18px;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile .ic{font-size:1.8rem}
.tile b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.15rem;margin-top:6px}
.tile small{display:block;color:var(--mute);margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:1.15rem;margin-bottom:2px}
.d{color:var(--mute);font-size:.9rem;margin:0 0 12px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .3s}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.item input{margin-top:5px;accent-color:var(--gold);width:17px;height:17px;flex:none}
.item.done span{text-decoration:line-through;color:var(--mute)}
.item a{color:var(--gold)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:600;background:var(--gold);color:#17120a;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry small{color:var(--mute)}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:.85rem;padding:7px 12px;border-radius:99px}
#chat{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--gold);color:#17120a}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px 6px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.92rem;white-space:nowrap}
.tabs a.on{color:var(--gold2);border-color:var(--gold)}
.body{flex:1;min-width:0}
.body>span{cursor:pointer}
.lk{display:flex;gap:14px;margin-top:3px;font-size:.82rem}
.lk a,.hubl a{color:var(--gold);text-decoration:none}
.hub{margin-bottom:14px}
.hub h3{margin-bottom:10px}
.hubl{display:flex;flex-wrap:wrap;gap:8px}
.hubl a{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 13px;font-size:.88rem}
body{background:radial-gradient(800px 360px at 50% -60px,var(--glow),transparent),var(--bg)}
.hero{display:flex;align-items:center;gap:14px}
.logo{flex:none}.logo svg{display:block}
nav a{display:inline-flex;align-items:center;gap:6px}
nav a.on .ic{color:#17120a}
.ic{display:inline-flex;color:var(--gold)}
.tile .ic{font-size:1rem}
.hh{display:flex;align-items:center;gap:10px}
.lkb{background:none;border:0;padding:0;color:var(--gold);font:inherit;font-weight:500;cursor:pointer}
.note{margin-top:6px;padding:8px 10px;border-left:2px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;font-size:.9rem;white-space:pre-wrap}
.nedit textarea{min-height:70px;margin-top:6px}
.srcs{display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:.84rem}
.srcs a{color:var(--gold);text-decoration:none}
.srcs a:hover{text-decoration:underline}
.logo{color:var(--gold)}
.tile:hover{box-shadow:0 10px 30px -14px var(--glow2)}
.item input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--mute);border-radius:6px;background:transparent;position:relative;margin-top:3px;cursor:pointer;flex:none}
.item input:checked{background:var(--gold);border-color:var(--gold)}
.item input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #0b0b0d;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tabs a small{margin-left:8px;color:var(--mute);font-weight:500}
.tabs a.on small{color:var(--gold)}
details.hub{margin:16px 0 0}
.hub summary{cursor:pointer;font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--gold2);list-style:none}
.hub summary::-webkit-details-marker{display:none}
.hub summary::after{content:" +";color:var(--mute)}
.hub[open] summary::after{content:" −"}
.hub[open] summary{margin-bottom:12px}
.cont{display:block;text-decoration:none;color:var(--ink);margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;background:var(--card)}
.cont small{display:block;color:var(--gold);font-size:.8rem;margin-bottom:2px}
.cont b{font-weight:500}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.sw{display:flex;align-items:center;gap:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:500}
.sw.on{border-color:var(--gold)}
.sw i{width:18px;height:18px;border-radius:50%;display:block}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:up .35s ease}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:10px;font-weight:500;font-size:.95rem;line-height:1.35}
.opt.ok{border-color:#3ecf8e;background:rgba(62,207,142,.12)}
.opt.bad{border-color:#ff6b6b;background:rgba(255,107,107,.12)}
.opt:disabled{opacity:1;color:var(--ink)}
.qex{margin-top:14px;font-size:.93rem;line-height:1.5}
.qbig{font-size:2.6rem;font-weight:600;color:var(--gold)}
.qres{text-align:center}.qres .row{justify-content:center}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.qrow small{color:var(--gold)}
nav .sep{flex:none;width:1px;background:var(--line);margin:6px 2px}
nav a.tool{width:34px;height:34px;padding:0;justify-content:center;border-radius:50%;font-size:.9rem}
.tiles{grid-template-columns:1fr 1fr;gap:12px}
.tiles .tile{padding:14px}
.tiles .tile small{font-size:.78rem;line-height:1.35}
.toolrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mute);font-size:.74rem;font-weight:500;text-decoration:none}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tcont{display:block;font-size:.74rem;font-weight:500;color:var(--gold);margin:0 0 8px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
footer{margin-top:40px;color:var(--mute);font-size:.88rem;text-align:center}
</style>
</head>

      <div class="row"><button id="logBtn">Save entry</button></div><div id="log"></div></div>

      <textarea id="coachIn" placeholder="Ask anything…" style="min-height:60px"></textarea>
      <div class="row"><button id="coachBtn">Send</button></div>

</div>

var hist=[],coach=null,busy=false,mode="coach",modeSys="";
function ctx(){var p=Object.keys(TR).map(function(id){var k=0;TR[id].steps.forEach(function(s,i){if(S.done[id+i])k++});return TR[id].name+": "+k+"/"+TR[id].steps.length});
 var r=S.log.slice(-3).map(function(e){return e.date+": "+e.text}).join(" | ");
 return "Their progress: "+p.join("; ")+"."+(r?" Recent log entries: "+r:"")}
function focus(){var id=(S.last&&TR[S.last])?S.last:"nfl",t=TR[id],st=t.steps[0];t.steps.some(function(x,i){if(!S.done[id+i]){st=x;return true}});return t.name+": "+st}
function addMsg(role,text){var m=el("div","msg "+(role==="user"?"me":"bot"),text),b=document.getElementById("chat");b.appendChild(m);b.scrollTop=b.scrollHeight;return m}
function ask(text,hidden){text=(text||"").trim();if(!text||busy||!coach)return;
 busy=true;var btn=document.getElementById("coachBtn");btn.disabled=true;document.getElementById("coachIn").value="";
 addMsg("user",text);hist.push({role:"user",content:(hidden?hidden+"\n\n":"")+text});if(hist.length>11)hist=hist.slice(-11);
 var msgs=hist.map(function(m){return{role:m.role,content:m.content}});msgs[0]={role:"user",content:SYS+" "+modeSys+" "+ctx()+"\n\n"+msgs[0].content};
 var out=addMsg("bot","Thinking…");
 coach(msgs,{cache:false,onText:function(o){out.textContent=o.text}}).then(function(r){out.textContent=r.text;hist.push({role:"assistant",content:r.text})})
 .catch(function(e){hist.pop();out.textContent=(e&&e.code==="not_granted")?"Your Coach needs permission to run. Reload and allow it when asked.":(e&&e.code==="rate_limited")?"Too many requests. Wait a moment and try again.":"Something went wrong. Please try again."})
 .then(function(){busy=false;btn.disabled=false})}
function setMode(id){var m=MODES.filter(function(x){return x.id===id})[0]||MODES[0];mode=m.id;modeSys=m.sys;hist=[];
 document.getElementById("chat").textContent="";
 var mb=document.getElementById("modes");mb.textContent="";
 MODES.forEach(function(x){var b=el("button","chip"+(x.id===mode?" on":""),x.icon+" "+x.name);b.onclick=function(){setMode(x.id)};mb.appendChild(b)});
 document.getElementById("modeDesc").textContent=m.desc;
 var c=document.getElementById("chips");c.textContent="";m.prompts.forEach(function(q){var b=el("button","chip",q);b.onclick=function(){ask(q)};c.appendChild(b)})}
function initCoach(){var n=document.getElementById("coachNote");
 if(!(window.claude&&window.claude.use)){n.textContent="Your Coach is available when you open this page in Claude.";return}
 window.claude.use("sample").then(function(s){if(!s){n.textContent="Your Coach isn’t available in this view.";return}
  coach=s;n.textContent="Pick a mode, then ask.";
  document.getElementById("coachBox").style.display="block";setMode("coach");
  document.getElementById("coachBtn").onclick=function(){ask(document.getElementById("coachIn").value)};
  document.getElementById("coachIn").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(this.value)}};
 }).catch(function(){n.textContent="Your Coach isn’t available in this view."})}

var CCOL={football:["#3ddc84","#9af0bf"],finance:["#b18cff","#d6c2ff"],business:["#3fe0d0","#9bf2ea"],coding:["#ff8a1f","#ffb86b"]};
var THEMES=[{id:"gold",name:"Gold",a:"#d4a84b",b:"#f0cf7e"},{id:"orange",name:"Neon orange",a:"#ff8a1f",b:"#ffb86b"},{id:"neon",name:"Neon green",a:"#39ff88",b:"#9dffc4"},{id:"aqua",name:"Aqua",a:"#3fe0d0",b:"#9bf2ea"},{id:"violet",name:"Violet",a:"#b18cff",b:"#d6c2ff"}];
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(",")}
function paint(a,b){var r=document.documentElement.style;r.setProperty("--gold",a);r.setProperty("--gold2",b);r.setProperty("--glow","rgba("+hexRgb(a)+",.16)");r.setProperty("--glow2","rgba("+hexRgb(a)+",.35)")}
function curTheme(){return THEMES.filter(function(x){return x.id===S.theme})[0]||THEMES[0]}
function applyTheme(id){var t=THEMES.filter(function(x){return x.id===id})[0]||THEMES[0];paint(t.a,t.b);S.theme=t.id;accentFor(cur)}
function accentFor(h){var ck=CATS[h]?h:(TR[h]?TR[h].cat:null);if(ck&&CCOL[ck])paint(CCOL[ck][0],CCOL[ck][1]);else{var t=curTheme();paint(t.a,t.b)}}
function renderSwatches(){var b=document.getElementById("swatches");b.textContent="";
 THEMES.forEach(function(t){var x=el("button","sw"+((S.theme||"gold")===t.id?" on":"")),d=el("i");d.style.background=t.a;x.appendChild(d);x.appendChild(document.createTextNode(t.name));
  x.onclick=function(){applyTheme(t.id);save();renderSwatches()};b.appendChild(x)})}
load();applyTheme(S.theme);renderLog();renderSwatches();route();initCoach();
window.addEventListener("hashchange",route);
